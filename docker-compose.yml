version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cybercortex-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cybercortex
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
    volumes:
      - mongodb_data:/data/db
    networks:
      - cybercortex-network

volumes:
  mongodb_data:
    driver: local

networks:
  cybercortex-network:
    driver: bridge
